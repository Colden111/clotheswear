<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header>
        <div class="container">
            <h1>🛍️ Admin Panel</h1>
            <nav>
                <a href="index.html">Ana Səhifə</a>
                <button id="logoutBtn" class="btn-logout" onclick="logout()">Çıxış</button>
            </nav>
        </div>
    </header>

    <!-- Ana Məzmun -->
    <main class="container">
        <!-- Yeni Məhsul Əlavə Et Düyməsi -->
        <div class="admin-header">
            <h2>Məhsulları İdarə Et</h2>
            <button id="addProductBtn" class="btn" onclick="openForm()">+ Yeni Məhsul</button>
        </div>

        <!-- Məhsul Formu (gizli) -->
        <div id="productFormContainer" class="form-container hidden">
            <h3 id="formTitle">Yeni Məhsul Əlavə Et</h3>
            <form id="productForm" onsubmit="event.preventDefault(); saveProduct();">
                <div class="form-group">
                    <label for="productName">Məhsul Adı:</label>
                    <input type="text" id="productName" name="productName" required>
                </div>

                <div class="form-group">
                    <label for="productCategory">Kateqoriya:</label>
                    <select id="productCategory" name="productCategory" required>
                        <option value="Kişi">Kişi</option>
                        <option value="Qadın">Qadın</option>
                        <option value="Uşaq">Uşaq</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="productPrice">Qiymət (AZN):</label>
                    <input type="number" id="productPrice" name="productPrice" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="productImage">Şəkil URL:</label>
                    <input type="url" id="productImage" name="productImage" required>
                </div>

                <div class="form-group">
                    <label for="productDescription">Təsvir:</label>
                    <textarea id="productDescription" name="productDescription" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="productSizes">Ölçülər (vergüllə ayırın):</label>
                    <input type="text" id="productSizes" name="productSizes" value="S, M, L, XL" required>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn">Yadda Saxla</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary" onclick="closeForm()">Ləğv
                        et</button>
                </div>
            </form>
        </div>

        <!-- Məhsullar Cədvəli -->
        <div class="table-container">
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Şəkil</th>
                        <th>Ad</th>
                        <th>Kateqoriya</th>
                        <th>Qiymət</th>
                        <th>Əməliyyatlar</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <!-- Məhsullar JavaScript ilə buraya gələcək -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
    <script>
        checkAdminAuth();
        getAdminProducts();
    </script>
</body>

</html>
